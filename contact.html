<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .contact-box{
            max-width:700px;
            margin:auto;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🍴 Foodie</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="products.html">Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="cart.html">Cart</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="contact.html">Contact</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<section class="py-5">
    <div class="container">
        <div class="text-center mb-5">
            <h2 class="fw-bold">Contact Us</h2>
            <p id="welcomeMessage" class="text-muted">Want to contact us?</p>

            <button class="btn btn-success" onclick="getName()">
                Enter Your Name
            </button>
        </div>

        <div class="contact-box">
            <div class="card shadow-sm p-4">

                <label class="form-label">Email</label>
                <input type="email" class="form-control mb-3" placeholder="Enter your email">

                <label class="form-label">Message</label>
                <textarea class="form-control mb-3" rows="5" placeholder="Enter your message"></textarea>

                <button class="btn btn-dark" onclick="sendMessage()">
                    Send Message
                </button>

            </div>
        </div>
    </div>
</section>

<footer class="bg-dark text-white text-center py-4">
    <h5>🍴 Foodie</h5>
    <p class="mb-0">Delicious food, happy moments.</p>
</footer>

<script>
function getName(){
    let name = prompt("Enter your name:");

    if(name){
        document.getElementById("welcomeMessage").innerText =
        "Hello " + name + ", how can we help you?";
    }
}

function sendMessage(){
    alert("Message sent successfully!");
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
