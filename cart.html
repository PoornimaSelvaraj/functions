<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie - Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            🍴 Foodie
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="products.html">Products</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="cart.html">Cart</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<section class="py-5 flex-grow-1">

    <div class="container">

        <h2 class="text-center fw-bold mb-5">
            Shopping Cart
        </h2>

        <div id="cartItems"></div>

        <div id="emptyCart" class="text-center py-5 d-none">

            <i class="bi bi-cart-x display-1 text-muted"></i>

            <h4 class="mt-3">
                Your cart is empty
            </h4>

            <a href="products.html" class="btn btn-dark mt-2">
                Shop Now
            </a>

        </div>

        <div id="cartSummary" class="card shadow-sm mt-4">

            <div class="card-body">

                <div class="d-flex justify-content-between fs-5">

                    <strong>
                        Total Amount
                    </strong>

                    <strong id="totalAmount">
                        ₹0
                    </strong>

                </div>

                <button class="btn btn-success w-100 mt-4" onclick="placeOrder()">
                    Place Order
                </button>

            </div>

        </div>

    </div>

</section>

<footer class="bg-dark text-white text-center py-4">

    <h5>🍴 Foodie</h5>

    <p class="mb-0">
        Delicious food, happy moments.
    </p>

</footer>

<script>

let cart = JSON.parse(localStorage.getItem("foodCart")) || [];

function displayCart(){

    let cartItems = document.getElementById("cartItems");
    let emptyCart = document.getElementById("emptyCart");
    let cartSummary = document.getElementById("cartSummary");
    let totalAmount = document.getElementById("totalAmount");

    cartItems.innerHTML = "";

    if(cart.length === 0){

        emptyCart.classList.remove("d-none");
        cartSummary.classList.add("d-none");

        return;
    }

    emptyCart.classList.add("d-none");
    cartSummary.classList.remove("d-none");

    let total = 0;

    cart.forEach((item,index) => {

        let itemTotal = item.price * item.quantity;

        total = total + itemTotal;

        cartItems.innerHTML += `

        <div class="card mb-3 shadow-sm">

            <div class="card-body">

                <div class="row align-items-center">

                    <div class="col-md-5">

                        <h5>
                            ${item.name}
                        </h5>

                        <p class="mb-0">
                            ₹${item.price}
                        </p>

                    </div>

                    <div class="col-md-3">

                        <button class="btn btn-outline-dark btn-sm" onclick="decreaseQuantity(${index})">
                            -
                        </button>

                        <span class="mx-3 fw-bold">
                            ${item.quantity}
                        </span>

                        <button class="btn btn-outline-dark btn-sm" onclick="increaseQuantity(${index})">
                            +
                        </button>

                    </div>

                    <div class="col-md-2">

                        <strong>
                            ₹${itemTotal}
                        </strong>

                    </div>

                    <div class="col-md-2">

                        <button class="btn btn-danger" onclick="deleteItem(${index})">

                            <i class="bi bi-trash"></i>

                        </button>

                    </div>

                </div>

            </div>

        </div>

        `;

    });

    totalAmount.innerText = "₹" + total;
}

function increaseQuantity(index){

    cart[index].quantity++;

    localStorage.setItem("foodCart",JSON.stringify(cart));

    displayCart();
}

function decreaseQuantity(index){

    cart[index].quantity--;

    if(cart[index].quantity <= 0){

        deleteItem(index);

        return;
    }

    localStorage.setItem("foodCart",JSON.stringify(cart));

    displayCart();
}

function deleteItem(index){

    let result = confirm("Are you sure you want to delete?");

    if(result){

        cart.splice(index,1);

        localStorage.setItem("foodCart",JSON.stringify(cart));

        alert("Deleted successfully!");

        displayCart();

    }
    else{

        alert("Delete cancelled!");

    }

}

function placeOrder(){

    if(cart.length === 0){

        alert("Your cart is empty!");

        return;
    }

    window.location.href = "order-confirmation.html";
}

displayCart();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
